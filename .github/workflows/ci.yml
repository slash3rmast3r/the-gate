name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action can fail on root commits (tries `ROOT^..HEAD`).
      # Run the CLI against the full repo history instead.
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.24.0"
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Gitleaks detect
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact --exit-code 1

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: backend/go.sum
      - name: Download modules
        env:
          GOTOOLCHAIN: auto
        run: go mod download
      - name: Vet
        env:
          GOTOOLCHAIN: auto
        run: go vet ./...
      - name: Build
        env:
          GOTOOLCHAIN: auto
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/gate ./cmd/gate
      - name: Test
        env:
          GOTOOLCHAIN: auto
        run: go test ./...

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install
        run: npm install
      - name: Build
        run: npm run build

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose (with dummy env)
        run: |
          set -euo pipefail
          cp .env.example .env
          # Satisfy required placeholders for `docker compose config`
          sed -i \
            -e 's/^GATE_ADMIN_PASSWORD=.*/GATE_ADMIN_PASSWORD=ci-test-password-not-for-prod/' \
            -e 's/^GATE_SESSION_SECRET=.*/GATE_SESSION_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef/' \
            -e 's/^BOUNCER_KEY_TRAEFIK=.*/BOUNCER_KEY_TRAEFIK=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef/' \
            -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-test-password-not-for-prod/' \
            .env
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.hub-update.yml config >/dev/null
          rm -f .env

  docker-build:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build gate-api
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: the-gate-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build gate-ui
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: the-gate-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: the-gate

networks:
  gate:
    name: the-gate
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET_PREFIX:-172.23.223}.0/24
          gateway: ${SUBNET_PREFIX:-172.23.223}.1

volumes:
  pgdata:
  traefik-letsencrypt:
  traefik-plugins:
  crowdsec-config:
  crowdsec-data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: gate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gate}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      gate:
        ipv4_address: ${SUBNET_PREFIX:-172.23.223}.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gate} -d ${POSTGRES_DB:-gate}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE"]

  crowdsec:
    image: crowdsecurity/crowdsec:v1.6.9
    container_name: gate-crowdsec
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Rome}
      COLLECTIONS: >-
        crowdsecurity/linux
        crowdsecurity/traefik
        crowdsecurity/http-cve
        crowdsecurity/appsec-virtual-patching
        crowdsecurity/appsec-generic-rules
      BOUNCER_KEY_traefik: ${BOUNCER_KEY_TRAEFIK:?set BOUNCER_KEY_TRAEFIK}
      GID: "1000"
    volumes:
      - ./crowdsec/acquis.d:/etc/crowdsec/acquis.d:ro
      - ./logs/traefik:/var/log/traefik:ro
      - crowdsec-config:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data
    networks:
      gate:
        ipv4_address: ${SUBNET_PREFIX:-172.23.223}.5
    expose: ["8080", "7422"]
    security_opt: ["no-new-privileges:true"]
    dns: ["1.1.1.1", "8.8.8.8"]

  whoami:
    image: traefik/whoami:v1.10
    container_name: gate-whoami
    restart: unless-stopped
    networks:
      gate:
        ipv4_address: ${SUBNET_PREFIX:-172.23.223}.20
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true

  gate-errors:
    image: nginx:1.27-alpine
    container_name: gate-errors
    restart: unless-stopped
    volumes:
      - ./errorpages:/usr/share/nginx/html:ro
    networks:
      gate:
        ipv4_address: ${SUBNET_PREFIX:-172.23.223}.21
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run", "/tmp"]

  traefik:
    image: traefik:v3.3
    container_name: gate-traefik
    restart: unless-stopped
    depends_on:
      crowdsec:
        condition: service_started
      gate-api:
        condition: service_healthy
      gate-errors:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    command:
      - --configFile=/etc/traefik/traefik.yml
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-admin@example.com}
    environment:
      TZ: ${TZ:-Europe/Rome}
      BOUNCER_KEY_TRAEFIK: ${BOUNCER_KEY_TRAEFIK}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./coraza:/etc/coraza:ro
      - ./logs/traefik:/var/log/traefik
      - traefik-letsencrypt:/letsencrypt
      - traefik-plugins:/plugins-storage
    networks:
      gate:
        ipv4_address: ${SUBNET_PREFIX:-172.23.223}.10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt: ["no-new-privileges:true"]
    dns: ["1.1.1.1", "8.8.8.8"]

  gate-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: the-gate-api:local
    container_name: gate-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Rome}
      GATE_LISTEN: ":8080"
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-gate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gate}
      GATE_ADMIN_USER: ${GATE_ADMIN_USER:-admin}
      GATE_ADMIN_PASSWORD: ${GATE_ADMIN_PASSWORD:?set GATE_ADMIN_PASSWORD}
      GATE_SESSION_SECRET: ${GATE_SESSION_SECRET:?set GATE_SESSION_SECRET}
      GATE_TRAEFIK_DYNAMIC_DIR: /traefik-dynamic
      GATE_CORAZA_DIR: /coraza
      GATE_LOG_DIR: /var/log/traefik
      GATE_CROWDSEC_CONTAINER: gate-crowdsec
      GATE_AUTH_MODE: ${GATE_AUTH_MODE:-local}
      GATE_OIDC_ISSUER: ${GATE_OIDC_ISSUER:-}
      GATE_OIDC_CLIENT_ID: ${GATE_OIDC_CLIENT_ID:-}
      GATE_OIDC_CLIENT_SECRET: ${GATE_OIDC_CLIENT_SECRET:-}
      GATE_OIDC_REDIRECT_URL: ${GATE_OIDC_REDIRECT_URL:-}
      AUTHENTIK_FORWARD_URL: ${AUTHENTIK_FORWARD_URL:-http://authentik-server:9000/outpost.goauthentik.io/auth/traefik}
      GATE_AUTO_UPDATE_PROTECTIONS: ${GATE_AUTO_UPDATE_PROTECTIONS:-false}
      GATE_AUTO_UPDATE_HOURS: ${GATE_AUTO_UPDATE_HOURS:-24}
      CROWDSEC_LAPI: http://crowdsec:8080
      CROWDSEC_LAPI_KEY: ${BOUNCER_KEY_TRAEFIK}
      BOUNCER_KEY_TRAEFIK: ${BOUNCER_KEY_TRAEFIK}
    volumes:
      - ./traefik/dynamic:/traefik-dynamic
      - ./coraza:/coraza
      - ./logs/traefik:/var/log/traefik:ro
      # docker.sock is NOT mounted by default (safer for public deploys).
      # To enable CrowdSec Hub updates from the UI, also use:
      #   docker compose -f docker-compose.yml -f docker-compose.hub-update.yml up -d
    networks:
      gate:
        ipv4_address: ${SUBNET_PREFIX:-172.23.223}.4
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]

  gate-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: the-gate-ui:local
    container_name: gate-ui
    restart: unless-stopped
    depends_on:
      gate-api:
        condition: service_healthy
    ports:
      - "${GATE_PORT:-9444}:8443"
    environment:
      GATE_API_UPSTREAM: http://gate-api:8080
    networks:
      gate:
        ipv4_address: ${SUBNET_PREFIX:-172.23.223}.3
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]
# Minimal SQLi/XSS samples until full CRS is fetched
# These are NOT a replacement for OWASP CRS — run fetch-crs.sh ASAP.

SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_HEADERS|XML:/* \
  "@rx (?i)(?:\bunion\b.{1,20}\bselect\b|\bor\b\s+\d+\s*=\s*\d+|'\s*or\s+'1'\s*=\s*'1)" \
  "id:949100,phase:2,deny,status:403,log,msg:'SQLi probe blocked (bootstrap)'"

SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_HEADERS \
  "@rx (?i)<\s*script\b|javascript\s*:|onerror\s*=" \
  "id:949110,phase:2,deny,status:403,log,msg:'XSS probe blocked (bootstrap)'"

SecRule REQUEST_URI \
  "@rx (?i)(?:\.\./|\betc/passwd\b|\bwp-login\.php\b|\bphpmyadmin\b)" \
  "id:949120,phase:1,deny,status:403,log,msg:'Scanner/LFI probe blocked (bootstrap)'"
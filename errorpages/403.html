<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>403 — Forbidden</title>
  <style>
    :root { color-scheme: light; --ink:#1a1f1c; --muted:#5c675f; --brand:#0f3d2e; --bg:#f3efe6; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:"Segoe UI",system-ui,sans-serif;
      background: radial-gradient(900px 500px at 10% -10%, rgba(31,111,84,.12), transparent 55%), var(--bg); color:var(--ink); }
    main { text-align:center; padding:2rem; max-width:28rem; }
    h1 { font-size:3.5rem; margin:0; letter-spacing:-.04em; color:var(--brand); }
    p { color:var(--muted); line-height:1.5; }
    .mark { font-weight:700; letter-spacing:-.03em; margin-bottom:.5rem; }
    a { color:var(--brand); }
  </style>
</head>
<body>
  <main>
    <div class="mark">The Gate</div>
    <h1>403</h1>
    <p>Access denied. Your request was blocked by the edge policy.</p>
    <p style="font-size:.75rem;opacity:.7;margin-top:2rem">© 2026 Carlo Savino — Over The Cloud — <a href="https://overthecloud.it">overthecloud.it</a></p>
  </main>
</body>
</html>
